# Cada merge na main atualiza o PR "Release vX.Y.Z" com as mudanças desde a última versão.
# O merge desse PR cria a tag, a release no GitHub e o CHANGELOG. O deploy continua manual (README, "Releases").
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
